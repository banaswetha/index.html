<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Base Converter & Boolean Logic Simulator</title>
<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --card2:#334155;
    --accent:#38bdf8;
    --text:#e2e8f0;
    --muted:#94a3b8;
    --success:#22c55e;
    --danger:#ef4444;
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,system-ui,sans-serif;
}
body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:20px;
}
.container{
    max-width:1000px;
    margin:auto;
}
.card{
    background:var(--card);
    border-radius:16px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
}
h1{
    text-align:center;
    margin-bottom:20px;
}
.tabs{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}
.tab-btn{
    flex:1;
    border:none;
    padding:14px;
    border-radius:10px;
    background:var(--card2);
    color:var(--text);
    cursor:pointer;
    transition:.3s;
    font-weight:600;
}
.tab-btn.active{
    background:var(--accent);
    color:#000;
}
.tab-content{
    display:none;
}
.tab-content.active{
    display:block;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}
.field{
    display:flex;
    flex-direction:column;
    gap:8px;
}
label{
    color:var(--muted);
    font-size:.9rem;
}
input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #475569;
    background:#0f172a;
    color:var(--text);
    outline:none;
}
input:focus{
    border-color:var(--accent);
}
.status{
    margin-top:12px;
    font-size:.95rem;
}
.valid{ color:var(--success); }
.invalid{ color:var(--danger); }

.complements{
    margin-top:20px;
    display:grid;
    gap:10px;
}
.comp-box{
    background:var(--card2);
    padding:12px;
    border-radius:10px;
    word-break:break-all;
}

.logic-top{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    background:#0f172a;
    color:white;
}

.switch-row{
    display:flex;
    gap:20px;
    margin-top:15px;
    flex-wrap:wrap;
}

.switch-wrap{
    display:flex;
    align-items:center;
    gap:10px;
}

.switch{
    position:relative;
    width:60px;
    height:30px;
}
.switch input{
    display:none;
}
.slider{
    position:absolute;
    inset:0;
    background:#475569;
    border-radius:20px;
    cursor:pointer;
}
.slider::before{
    content:"";
    position:absolute;
    width:24px;
    height:24px;
    background:white;
    border-radius:50%;
    top:3px;
    left:3px;
    transition:.25s;
}
.switch input:checked + .slider{
    background:var(--success);
}
.switch input:checked + .slider::before{
    transform:translateX(30px);
}

.output{
    margin-top:15px;
    padding:15px;
    background:var(--card2);
    border-radius:10px;
    font-size:1.2rem;
    text-align:center;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
th,td{
    border:1px solid #475569;
    padding:10px;
    text-align:center;
}
th{
    background:#0f172a;
}
.highlight{
    background:rgba(56,189,248,.3);
}
@media (max-width:600px){
    h1{
        font-size:1.4rem;
    }
}
</style>
</head>
<body>
<div class="container">
<div class="card">

<h1>Number Base Converter & Boolean Logic Simulator</h1>

<div class="tabs">
    <button class="tab-btn active" data-tab="converter">Base Converter</button>
    <button class="tab-btn" data-tab="logic">Logic Simulator</button>
</div>

<!-- TAB 1 -->
<div id="converter" class="tab-content active">

    <div class="grid">
        <div class="field">
            <label>Binary</label>
            <input id="binary" placeholder="e.g. 101010">
        </div>

        <div class="field">
            <label>Octal</label>
            <input id="octal" placeholder="e.g. 52">
        </div>

        <div class="field">
            <label>Decimal</label>
            <input id="decimal" placeholder="e.g. 42">
        </div>

        <div class="field">
            <label>Hexadecimal</label>
            <input id="hex" placeholder="e.g. 2A">
        </div>
    </div>

    <div class="status" id="status">
        Enter a number in any base.
    </div>

    <div class="complements">
        <div class="comp-box">
            <strong>8-bit Binary:</strong>
            <span id="bin8">-</span>
        </div>

        <div class="comp-box">
            <strong>1's Complement:</strong>
            <span id="ones">-</span>
        </div>

        <div class="comp-box">
            <strong>2's Complement:</strong>
            <span id="twos">-</span>
        </div>
    </div>
</div>

<!-- TAB 2 -->
<div id="logic" class="tab-content">

<div class="logic-top">

<div>
<label>Logic Gate</label>
<select id="gate">
    <option>AND</option>
    <option>OR</option>
    <option>NOT</option>
    <option>NAND</option>
    <option>NOR</option>
    <option>XOR</option>
</select>

<div class="switch-row">

<div class="switch-wrap">
    <span>A</span>
    <label class="switch">
        <input type="checkbox" id="aInput">
        <span class="slider"></span>
    </label>
</div>

<div class="switch-wrap" id="bWrap">
    <span>B</span>
    <label class="switch">
        <input type="checkbox" id="bInput">
        <span class="slider"></span>
    </label>
</div>

</div>

<div class="output">
    Output = <span id="output">0</span>
</div>
</div>

<div>
<table id="truthTable">
    <thead>
        <tr>
            <th>A</th>
            <th>B</th>
            <th>Output</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
</div>

</div>

</div>

</div>
</div>

<script>
/* ---------- Tabs ---------- */
document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click",()=>{
        document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach(c=>c.classList.remove("active"));

        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.add("active");
    });
});

/* ---------- Base Converter ---------- */
const fields = {
    binary: document.getElementById("binary"),
    octal: document.getElementById("octal"),
    decimal: document.getElementById("decimal"),
    hex: document.getElementById("hex")
};

const status = document.getElementById("status");
let updating = false;

function validate(value, base){
    const patterns = {
        2:/^[01]+$/,
        8:/^[0-7]+$/,
        10:/^[0-9]+$/,
        16:/^[0-9a-fA-F]+$/
    };
    return patterns[base].test(value);
}

function updateComplements(num){
    if(num < 0 || num > 255){
        document.getElementById("bin8").textContent="Only shown for values 0-255";
        document.getElementById("ones").textContent="-";
        document.getElementById("twos").textContent="-";
        return;
    }

    let bin8 = num.toString(2).padStart(8,"0");
    let ones = [...bin8].map(b=>b==="0"?"1":"0").join("");

    let twosNum = (parseInt(ones,2)+1) & 255;
    let twos = twosNum.toString(2).padStart(8,"0");

    document.getElementById("bin8").textContent = bin8;
    document.getElementById("ones").textContent = ones;
    document.getElementById("twos").textContent = twos;
}

function convert(source, base){
    if(updating) return;

    const value = source.value.trim();

    if(!value){
        updating=true;
        Object.values(fields).forEach(f=>{
            if(f!==source) f.value="";
        });
        updating=false;

        status.textContent="Enter a number in any base.";
        status.className="status";
        return;
    }

    if(!validate(value,base)){
        status.textContent="Invalid input for selected base.";
        status.className="status invalid";
        return;
    }

    const decimalValue = parseInt(value,base);

    updating=true;
    fields.binary.value = decimalValue.toString(2);
    fields.octal.value = decimalValue.toString(8);
    fields.decimal.value = decimalValue.toString(10);
    fields.hex.value = decimalValue.toString(16).toUpperCase();
    updating=false;

    status.textContent = "Valid input ✓";
    status.className = "status valid";

    updateComplements(decimalValue);
}

fields.binary.addEventListener("input",()=>convert(fields.binary,2));
fields.octal.addEventListener("input",()=>convert(fields.octal,8));
fields.decimal.addEventListener("input",()=>convert(fields.decimal,10));
fields.hex.addEventListener("input",()=>convert(fields.hex,16));

/* ---------- Logic Simulator ---------- */
const gateSelect = document.getElementById("gate");
const aInput = document.getElementById("aInput");
const bInput = document.getElementById("bInput");
const outputLabel = document.getElementById("output");
const tbody = document.querySelector("#truthTable tbody");
const bWrap = document.getElementById("bWrap");

function gateResult(g,a,b){
    switch(g){
        case "AND": return a & b;
        case "OR": return a | b;
        case "NOT": return a ? 0 : 1;
        case "NAND": return !(a & b) ? 1 : 0;
        case "NOR": return !(a | b) ? 1 : 0;
        case "XOR": return a ^ b;
    }
}

function buildTruthTable(){
    const gate = gateSelect.value;
    const A = aInput.checked ? 1 : 0;
    const B = bInput.checked ? 1 : 0;

    tbody.innerHTML = "";

    if(gate==="NOT"){
        bWrap.style.display="none";

        [0,1].forEach(a=>{
            const out = gateResult(gate,a,0);

            const row = document.createElement("tr");
            if(a===A) row.classList.add("highlight");

            row.innerHTML=
            `<td>${a}</td>
             <td>-</td>
             <td>${out}</td>`;

            tbody.appendChild(row);
        });

        outputLabel.textContent = gateResult(gate,A,0);
        return;
    }

    bWrap.style.display="flex";

    [[0,0],[0,1],[1,0],[1,1]].forEach(pair=>{
        const [a,b] = pair;
        const out = gateResult(gate,a,b);

        const row = document.createElement("tr");
        if(a===A && b===B) row.classList.add("highlight");

        row.innerHTML=
        `<td>${a}</td>
         <td>${b}</td>
         <td>${out}</td>`;

        tbody.appendChild(row);
    });

    outputLabel.textContent = gateResult(gate,A,B);
}

[gateSelect,aInput,bInput].forEach(el=>{
    el.addEventListener("change",buildTruthTable);
});

buildTruthTable();
</script>
</body>
</html>
